name: Instagram API check

on:
  workflow_dispatch:
    inputs:
      username:
        description: Verified profile to check with the official API (no data writes)
        type: string
        default: t1lol

permissions:
  contents: read

# A connection check must not run alongside collection or reset the collection
# monitor's incident state. This workflow is intentionally separate from sync.
concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check official API without data writes
        env:
          INSTAGRAM_GRAPH_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_GRAPH_ACCESS_TOKEN }}
          INSTAGRAM_GRAPH_USER_ID: ${{ secrets.INSTAGRAM_GRAPH_USER_ID }}
          INSTAGRAM_USERNAME: ${{ inputs.username }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: node --experimental-strip-types scripts/sync-instagram.ts --check-api --username="$INSTAGRAM_USERNAME"
