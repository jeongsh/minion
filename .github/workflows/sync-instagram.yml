name: Instagram Sync

on:
  schedule:
    - cron: '0 1,13 * * *'  # KST 오전 10시(01:00 UTC), 오후 10시(13:00 UTC)
  workflow_dispatch:
    inputs:
      scope:
        description: Collection scope
        type: choice
        default: all
        options: [all, teams, players]

permissions:
  contents: read

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run Instagram sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INSTAGRAM_SESSION_COOKIE: ${{ secrets.INSTAGRAM_SESSION_COOKIE }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          NEXT_PUBLIC_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_R2_PUBLIC_URL }}
          INSTAGRAM_SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          if [ "$INSTAGRAM_SCOPE" = all ]; then
            node --experimental-strip-types scripts/sync-instagram.ts
          else
            node --experimental-strip-types scripts/sync-instagram.ts --only="$INSTAGRAM_SCOPE"
          fi
