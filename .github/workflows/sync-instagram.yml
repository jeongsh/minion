name: Instagram Sync

on:
  schedule:
    - cron: '23 1,13 * * *'  # KST 10:23, 22:23; avoid the hourly scheduling peak
  workflow_dispatch:
    inputs:
      scope:
        description: Collection scope
        type: choice
        default: all
        options: [all, teams, players]
      no_notify:
        description: Skip fan notifications while recovering missed posts
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: instagram-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Instagram sync
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INSTAGRAM_GRAPH_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_GRAPH_ACCESS_TOKEN }}
          INSTAGRAM_GRAPH_USER_ID: ${{ secrets.INSTAGRAM_GRAPH_USER_ID }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          NEXT_PUBLIC_R2_PUBLIC_URL: ${{ secrets.NEXT_PUBLIC_R2_PUBLIC_URL }}
          INSTAGRAM_SCOPE: ${{ inputs.scope || 'all' }}
          INSTAGRAM_NO_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.no_notify && 'true' || 'false' }}
        run: |
          args=()
          if [ "$INSTAGRAM_SCOPE" != all ]; then
            args+=(--only="$INSTAGRAM_SCOPE")
          fi
          if [ "$INSTAGRAM_NO_NOTIFY" = true ]; then
            args+=(--no-notify)
          fi
          node --experimental-strip-types scripts/sync-instagram.ts "${args[@]}"
